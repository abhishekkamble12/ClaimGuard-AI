[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpilot"
version = "2.0.0"
description = "AI Dispute Risk Manager — Track 02: Razorpay AI Buildathon 2026"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Abhishek Kamble", email = "abhishekkamble@example.com"}
]
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "google-genai>=0.1.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "shap>=0.43.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "bandit>=1.7.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "ml*", "scoring*", "extraction*", "generation*", "intelligence*", "monitoring*", "razorpay_integration*", "utils*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["evaluation", "api/tests"]
python_files = ["test_*.py"]
