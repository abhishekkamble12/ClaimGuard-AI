name: ProofPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Security Vulnerability Scan (bandit)
        run: |
          bandit -r ml/ scoring/ api/ intelligence/ monitoring/ utils/ -s B101,B104,B105 --exit-zero

      - name: Generate Benchmark Synthetic Dataset (500 cases)
        run: |
          python data_generator.py --cases 500 --test-ratio 0.25 --out outputs/synthetic_chargeback_dataset.json

      - name: Train and Validate Calibrated Stacked Ensemble Model
        run: |
          python -m ml.win_predictor
          python -c "import json; m=json.load(open('outputs/model_comparison.json')); assert m['models']['stacked_ensemble']['roc_auc'] >= 0.65, 'Ensemble AUC below 65%'"

      - name: Run Core, Security & Scorer Unit Tests
        env:
          PROOFPILOT_API_KEY: "ci_test_key_proofpilot_2026"
          WEBHOOK_SECRET: "ci_test_webhook_secret_rzp"
        run: |
          python -m unittest discover -s evaluation -p "test_*.py" -v

      - name: Run FastAPI Microservice Integration Tests
        env:
          PROOFPILOT_API_KEY: "ci_test_key_proofpilot_2026"
          WEBHOOK_SECRET: "ci_test_webhook_secret_rzp"
        run: |
          python -m unittest discover -s api/tests -p "test_*.py" -v

      - name: Run ProofPilot Evaluation Benchmark & PR-AUC Gate
        env:
          PROOFPILOT_API_KEY: "ci_test_key_proofpilot_2026"
          WEBHOOK_SECRET: "ci_test_webhook_secret_rzp"
        run: |
          python evaluation/benchmark.py
          python -c "import json; m=json.load(open('outputs/evaluation_benchmark.json')); prauc=m['models']['proposed_calibrated_ensemble']['pr_auc']; assert prauc >= 0.45, f'PR-AUC {prauc} below 0.45 hurdle'"
          python evaluation/ragas_eval.py
