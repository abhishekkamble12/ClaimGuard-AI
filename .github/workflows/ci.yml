name: ProofPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Security Vulnerability Scan (bandit)
        run: |
          bandit -r ml/ scoring/ api/ intelligence/ monitoring/ utils/ -s B101,B104,B105 --exit-zero

      - name: Generate Benchmark Synthetic Dataset (500 cases)
        run: |
          python data_generator.py --cases 500 --test-ratio 0.25 --out outputs/synthetic_chargeback_dataset.json

      - name: Train and Validate Calibrated Stacked Ensemble Model
        run: |
          python ml/win_predictor.py
          python -c "import json; m=json.load(open('outputs/model_comparison.json')); assert m['models']['stacked_ensemble']['roc_auc'] >= 0.85, 'Ensemble AUC below 85%'"

      - name: Run Core & Scorer Unit Tests
        run: |
          python -m unittest discover -s evaluation -p "test_*.py" -v

      - name: Run FastAPI Microservice Integration Tests
        run: |
          python -m unittest discover -s api/tests -p "test_*.py" -v

      - name: Run ProofPilot Benchmark Evaluation Harness
        run: |
          python evaluation/evaluate.py
          python evaluation/ragas_eval.py
