name: ProofPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Benchmark Synthetic Dataset
        run: |
          python data_generator.py --cases 60 --test-ratio 0.33 --out outputs/synthetic_chargeback_dataset.json

      - name: Run Unit & Edge Case Test Suite
        run: |
          python -m unittest discover -s eval -p "test_*.py" -v

      - name: Run ProofPilot Evaluation Benchmark
        run: |
          python eval/evaluate.py
